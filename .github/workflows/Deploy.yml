
name: Deploy Beauty Spa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and prepare website
        shell: bash
        run: |
          set -e
          mkdir -p _source _site

          while IFS= read -r -d '' file; do
            echo "Extracting $file"
            unzip -oq "$file" -d _source
          done < <(
            find . -type f -name '*.zip' \
              -not -path './.git/*' \
              -not -path './_source/*' \
              -not -path './_site/*' -print0
          )

          INDEX=""
          for root in . _source; do
            if [ -f "$root/index.html" ]; then
              INDEX="$root/index.html"
              break
            fi
            if [ -f "$root/public/index.html" ]; then
              INDEX="$root/public/index.html"
              break
            fi
          done

          if [ -z "$INDEX" ]; then
            INDEX=$(find . _source \
              -type f -name index.html \
              -not -path './.git/*' \
              -not -path './.github/*' \
              -not -path './_site/*' \
              | head -n 1 || true)
          fi

          if [ -z "$INDEX" ]; then
            echo "ERROR: No index.html found in uploaded files or ZIP."
            exit 1
          fi

          SITE_DIR="${INDEX%/*}"
          [ "$SITE_DIR" != "$INDEX" ] || SITE_DIR="."
          cp -a "$SITE_DIR"/. _site/

          test -s _site/index.html
          touch _site/.nojekyll
          echo "Website prepared successfully."
          ls -la _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4


name: Deploy Beauty Spa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP and prepare site
        shell: bash
        run: |
          set -e
          mkdir -p _source _site

          ZIP_FILE="Beauty-Spa-Professional-Theme-Languages.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found in repository root."
            find . -maxdepth 2 -type f
            exit 1
          fi

          unzip -oq "$ZIP_FILE" -d _source

          if [ -f _source/index.html ]; then
            cp _source/index.html _site/index.html
          elif [ -f _source/public/index.html ]; then
            cp -a _source/public/. _site/
          else
            INDEX=$(find _source -type f -name index.html | head -n 1)
            if [ -z "$INDEX" ]; then
              echo "ERROR: ZIP contains no index.html."
              exit 1
            fi
            cp "$INDEX" _site/index.html
          fi

          if [ -d _source/assets ]; then
            cp -a _source/assets _site/
          fi

          touch _site/.nojekyll
          test -s _site/index.html
          echo "Website is ready to deploy."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
